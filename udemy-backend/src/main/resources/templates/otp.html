<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>OTP Verification</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f6f9fc;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 480px;
            background: #ffffff;
            margin: 30px auto;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .title {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .message {
            color: #444;
            font-size: 15px;
            line-height: 1.6;
        }

        .otp-box {
            margin: 25px 0;
            padding: 15px;
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 4px;
            background: #f0f4ff;
            border: 2px dashed #4a6fff;
            border-radius: 8px;
            color: #3a4eff;
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #888;
            text-align: center;
            line-height: 1.4;
        }

        .logo-text {
            color: #4a6fff;
            font-weight: bold;
        }
    </style>
</head>

<body>
<div class="container">
    <div class="title">Mã Xác Thực OTP</div>

    <p class="message">
        Xin chào <b th:text="${name}"></b>,<br>
        Bạn đã yêu cầu xác thực OTP. Vui lòng sử dụng mã bên dưới để tiếp tục:
    </p>

    <div class="otp-box" th:text="${otp}">123456</div>

    <p class="message">
        Mã OTP này có hiệu lực trong <b>5 phút</b>.  
        Nếu bạn không yêu cầu thao tác này, vui lòng bỏ qua email.
    </p>

    <div class="footer">
        Email được gửi bởi <span class="logo-text">Udemy Support</span><br>
        Đây là email tự động, vui lòng không trả lời.
    </div>
</div>
</body>
</html>
