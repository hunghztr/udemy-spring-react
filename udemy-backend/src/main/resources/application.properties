spring.application.name=udemy
#config db
spring.datasource.url=jdbc:mysql://localhost:3306/udemy?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=141512
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# import file secret
spring.config.import=optional:classpath:application-secret.properties
#config jwt
whisper.jwt.base64-secret=${KEY}
whisper.jwt.access-token-validity-in-seconds=300
whisper.jwt.refresh-token-validity-in-seconds=8640000

#config swagger
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

#config email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL}
spring.mail.password=${APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# OAuth2 Google Login
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# config cloudinary
cloudinary.cloud-name=${CLOUD_NAME}
cloudinary.api-key=${API_KEY}
cloudinary.api-secret=${API_SECRET}

#config file size
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.resolve-lazily=true

# Elasticsearch connection
spring.elasticsearch.uris=http://localhost:9200
# Timeout
spring.elasticsearch.connection-timeout=5s
spring.elasticsearch.socket-timeout=30s

# config vn pay
vnpay.tmnCode=${VNPAY_TMNCODE}
vnpay.hashSecret=${VNPAY_HASHSECRET}
vnpay.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=http://localhost:5173/payment-result

#config ollama AI
spring.ai.ollama.base-url=http://localhost:11434

# model
spring.ai.ollama.chat.options.model=qwen2.5:3b

# generation config
spring.ai.ollama.chat.options.temperature=0.6
spring.ai.ollama.chat.options.top-p=0.9
spring.ai.ollama.chat.options.num-predict=900
